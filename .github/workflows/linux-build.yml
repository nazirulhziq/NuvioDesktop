name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build from
        required: false
        default: Dev

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 (deb + AppImage)
    runs-on: ubuntu-24.04
    env:
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare local.properties
        shell: bash
        run: |
          # Nuvio account login needs the public backend config; these are
          # client-side publishable values that ship inside every Nuvio build.
          cat > local.properties <<'PROPS'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          NUVIO_SUPABASE_FALLBACK_URL=https://api-two.nuvioapp.space
          PROPS

      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          # Separate invocations: both tasks write to the shared app dir and
          # Gradle refuses to order them implicitly in one run.
          ./gradlew :composeApp:packageReleaseDeb \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace
          ./gradlew :composeApp:packageReleaseAppImage \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace

      - name: List outputs
        if: always()
        shell: bash
        run: |
          find composeApp/build/compose/binaries/main-release -maxdepth 3 -type f \( -name '*.deb' -o -name '*.AppImage' \) -printf '%p %s\n' || true

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-linux-packages
          path: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
